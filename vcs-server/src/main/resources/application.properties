spring.application.name=customvcs
# Load local credentials from the project root using Java properties syntax.
spring.config.import=optional:file:./.env[.properties]

customvcs.storage.root=${CVCS_STORAGE_ROOT:./data/repositories}

# Store repository metadata in the existing PostgreSQL database.
spring.datasource.url=${CVCS_DB_URL:jdbc:postgresql://localhost:5432/customvcs}
# Resolve credentials from local configuration or environment variables.
spring.datasource.username=${CVCS_DB_USERNAME}
spring.datasource.password=${CVCS_DB_PASSWORD}

# Avoid keeping a JPA session open for the entire HTTP request.
spring.jpa.open-in-view=false

# Flyway owns schema changes; Hibernate checks that entity mappings match.
spring.jpa.hibernate.ddl-auto=validate

# Same-origin browser sessions; enable Secure cookies behind HTTPS in deployment.
server.servlet.session.timeout=60m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${CVCS_SECURE_COOKIES:false}
